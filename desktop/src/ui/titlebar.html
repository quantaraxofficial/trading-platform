<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>TradePilot</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { margin: 0; height: 34px; overflow: hidden; background: var(--bar); color: var(--text); user-select: none; }
  .bar { display: flex; align-items: stretch; height: 34px; -webkit-app-region: drag;
    /* (Windows' own minimise / maximise / close sit at the right: room for them) */
    padding-right: calc(100vw - env(titlebar-area-width, calc(100vw - 138px))); }
  .brand { flex: none; width: 40px; display: flex; align-items: center; justify-content: center; }
  .brand svg { width: 22px; height: 22px; }
  .tabs { display: flex; align-items: stretch; min-width: 0; flex: 0 1 auto; overflow: hidden; }
  .tab { position: relative; display: flex; align-items: center; gap: 7px; min-width: 64px; max-width: 250px; flex: 0 1 250px; padding: 0 8px 0 12px;
    font-size: 13px; cursor: default; -webkit-app-region: no-drag; color: var(--muted); border-right: 1px solid var(--sep); transition: background .12s, color .12s; }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab.active { background: var(--tab); color: var(--text); }
  .tab.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); }
  .tab.dragging { opacity: .85; z-index: 2; box-shadow: 0 0 0 1px var(--accent) inset; }
  .tab .icon { flex: none; width: 16px; height: 16px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .tab .icon img { width: 16px; height: 16px; border-radius: 3px; }
  .tab .label { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; gap: 6px; align-items: baseline; }
  .tab .sym { font-weight: 600; color: var(--text); }
  .tab .price { font-variant-numeric: tabular-nums; }
  .up { color: #089981; } .down { color: #f23645; }
  .tab .x { flex: none; width: 20px; height: 20px; border-radius: 5px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .12s, background .12s; padding: 0; }
  .tab:hover .x, .tab.active .x { opacity: 1; }
  .tab .x:hover { background: var(--hover2); color: var(--text); }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { -webkit-app-region: no-drag; flex: none; width: 34px; height: 34px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; }
  .btn:hover { background: var(--hover); color: var(--text); }
  .btn.wide { width: 46px; }
  .new { width: 30px; }
  .new span { width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .new:hover { background: transparent; } .new:hover span { background: var(--hover2); }
  .grow { flex: 1; }
  .divider { width: 1px; margin: 9px 2px; background: var(--sep); }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="brand" title="TradePilot">
      <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
        <rect width="24" height="24" rx="6" fill="url(#g)"/><path d="M18.5 8.5l-6 6-3.5-3.5-4.5 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 8.5h4v4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Chart tabs"></div>
    <button class="btn new" id="new" title="New tab (Ctrl+T)" aria-label="New tab"><span>
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span></button>
    <div class="grow"></div>
    <button class="btn wide" id="newwin" title="Open new window (Ctrl+N)" aria-label="Open new window">
      <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1.5" width="16" height="10" rx="1.5"/><path d="M6 14.5h6M9 11.5v3"/></svg></button>
    <div class="divider"></div>
    <button class="btn wide" id="menu" title="Main menu" aria-label="Main menu" aria-haspopup="menu">
      <svg width="18" height="4" viewBox="0 0 18 4" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="2.5" cy="2" r="1.5"/><circle cx="9" cy="2" r="1.5"/><circle cx="15.5" cy="2" r="1.5"/></svg></button>
  </div>
  <script src="titlebar.js"></script>
</body>
</html>
