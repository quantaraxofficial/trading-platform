<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Menu</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .backdrop { position: fixed; inset: 0; }
  .menu { position: fixed; top: 38px; min-width: 280px; padding: 6px; border-radius: 10px; background: var(--panel); color: var(--text);
    border: 1px solid var(--sep); box-shadow: 0 12px 40px rgba(0,0,0,.45); font-size: 14px; animation: pop .12s ease-out; transform-origin: top right; }
  @keyframes pop { from { opacity: 0; transform: scale(.97) translateY(-4px); } to { opacity: 1; transform: none; } }
  .head { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0 10px; }
  .head .name { font-weight: 600; }
  .head .ver { font-size: 12px; color: var(--muted); }
  .sep { height: 1px; background: var(--sep); margin: 6px 4px; }
  .item { display: flex; align-items: center; gap: 12px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; }
  .item:hover:not(:disabled), .item:focus-visible { background: var(--hover2); outline: none; }
  .item:disabled { color: var(--muted); opacity: .6; }
  .item svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
  .item .lbl { flex: 1; }
  .item kbd { font: inherit; font-size: 12px; color: var(--muted); }
  .zoom { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 6px 0 10px; }
  .zoom .lbl { flex: 1; }
  .zoom button { width: 28px; height: 28px; border-radius: 6px; border: 0; background: var(--hover2); display: flex; align-items: center; justify-content: center; }
  .zoom button:hover { background: var(--accent); color: #fff; }
  .zoom output { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  .themes { display: flex; gap: 8px; padding: 6px 4px 4px; }
  .theme { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; font-size: 13px; color: var(--muted); }
  .theme .pv { width: 100%; height: 46px; border-radius: 8px; border: 2px solid var(--sep); overflow: hidden; display: flex; }
  .theme.on { color: var(--text); } .theme.on .pv { border-color: var(--accent); }
  .theme:hover .pv { border-color: var(--muted); } .theme.on:hover .pv { border-color: var(--accent); }
  .pv .d { flex: 1; background: #131722; } .pv .l { flex: 1; background: #f0f3fa; }
  .pv .d::before, .pv .l::before { content: ""; display: block; margin: 8px 6px; height: 28px; border-radius: 4px; background: rgba(139,92,246,.35); }
  .danger:hover { color: #f23645; }
</style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="menu" id="menu" role="menu"></div>
  <script src="menu.js"></script>
</body>
</html>
