<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>TradePilot</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { margin: 0; height: 100%; background: #131722; color: #d1d4dc; user-select: none; -webkit-app-region: drag; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; box-sizing: border-box;
    background: radial-gradient(circle at 50% 0%, rgba(124,58,237,.35), transparent 60%), #131722; }
  .logo { width: 64px; height: 64px; animation: float 2.4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-4px); } }
  h1 { margin: 4px 0 0; font-size: 20px; font-weight: 600; color: #fff; }
  .status { font-size: 14px; min-height: 20px; }
  .detail { font-size: 12.5px; color: #787b86; min-height: 18px; max-width: 380px; }
  .bar { width: 220px; height: 3px; border-radius: 2px; background: #2a2e39; overflow: hidden; }
  .bar span { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #a855f7, #6366f1); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .ask { display: none; flex-direction: column; gap: 12px; align-items: center; -webkit-app-region: no-drag; }
  .ask.show { display: flex; } .ask p { margin: 0; font-size: 13.5px; max-width: 380px; line-height: 20px; }
  .btns { display: flex; gap: 8px; }
  button { border: 1px solid #434651; background: #1e222d; border-radius: 8px; padding: 7px 14px; color: #d1d4dc; -webkit-app-region: no-drag; }
  button.primary { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .failed .bar { display: none; }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(#g)"/><path d="M18.5 8.5l-6 6-3.5-3.5-4.5 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 8.5h4v4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>TradePilot</h1>
  <div class="status" id="status">Starting…</div>
  <div class="detail" id="detail"></div>
  <div class="bar"><span></span></div>
  <div class="ask" id="ask"><p id="q"></p><div class="btns">
    <button class="primary" data-a="retry">Retry</button><button data-a="continue">Continue anyway</button><button data-a="quit">Quit</button></div></div>
  <script src="starting.js"></script>
</body>
</html>
